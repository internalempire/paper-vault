# SOLO host nuovo senza proxy esistente; non avviare sulla VPS condivisa con Shazam.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
networks:
  proxy:
    external: true
volumes:
  caddy_data:
  caddy_config:
